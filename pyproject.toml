[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-forge"
version = "0.1.0"
description = "Production-grade pure-Python + NumPy reverse-mode automatic differentiation and numerical stability engine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Aanuoluwapo" }
]
keywords = ["autograd", "autodiff", "numpy", "deep-learning", "numerical-stability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Aanuoluwapo1/tensor-forge"
Repository = "https://github.com/Aanuoluwapo1/tensor-forge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
